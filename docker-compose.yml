services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: eleitor-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eleitorai
      POSTGRES_USER: eleitorai
      POSTGRES_PASSWORD: eleitorai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eleitorai -d eleitorai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: