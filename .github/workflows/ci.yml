name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      API_PORT: 3001
      DATABASE_URL: postgresql://test:test@localhost:5432/test

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build